name: get session token
method: POST
url: "{{host}}/api/login"
headers:
  - name: Content-Type
    value: application/json
body: |
  {"username": "{{username}}", "password": "{{password}}"}
post: |
  -- extract a token from the response body into the chain store; the
  -- "use session token" request below reads it. Requires JSON, so this
  -- only makes sense against an API that returns one.
  local ok, token = pcall(function()
    local body = response.body
    local pos, len = string.find(body, '"token"%s*:%s*"')
    if pos == nil then error("no token in body") end
    local start = len + 1
    local val = string.sub(body, start, start + 80)
    return string.match(val, '^[^"]*')
  end)
  if ok then
    store.set("token", token)
    return true
  end
  return "could not extract token from response"
