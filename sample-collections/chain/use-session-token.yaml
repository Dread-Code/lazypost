name: use session token
method: GET
url: "{{host}}/api/me"
headers:
  - name: Accept
    value: application/json
pre: |
  -- read the token stored by "get session token" and send it as a header.
  -- Run that request first, then this one. If the store is empty, the
  -- header is skipped so the send fails loudly on a missing token.
  local token = store.get("token")
  if token ~= nil then
    req.headers["Authorization"] = "Bearer " .. token
  end
post: |
  -- assert we got an authenticated response
  if response.status_code == 401 or response.status_code == 403 then
    return "not authenticated — run 'get session token' first"
  end
  return true
